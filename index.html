
<!DOCTYPE html>
<html>
<head>
    <title>College Management System</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #f4f4f4;
        }

        header {
            background: #003366;
            color: white;
            text-align: center;
            padding: 20px;
        }

        nav {
            background: #0055aa;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .container {
            text-align: center;
            padding: 40px;
        }

        .card {
            display: inline-block;
            background: white;
            padding: 25px;
            margin: 10px;
            width: 180px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        button {
            background: #0055aa;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        footer {
            background: #003366;
            color: white;
            text-align: center;
            padding: 15px;
        }
    </style>
</head>

<body>

<header>
    <h1>College Management System</h1>
    <p>Welcome to Our College Portal</p>
</header>

<nav>
    <a href="index.html">Home</a>
    <a href="students.html">Students</a>
    <a href="faculty.html">Faculty</a>
    <a href="courses.html">Courses</a>
    <a href="login.html">Login</a>
</nav>

<div class="container">
    <h2>Welcome to College Dashboard</h2>
    <p>Manage all college activities easily.</p>

    <div class="card">
        <h3>Students</h3>
        <p>Manage student details</p>
        <button onclick="showMessage('Students')">
            View
        </button>
    </div>

    <div class="card">
        <h3>Faculty</h3>
        <p>Manage faculty details</p>
        <button onclick="showMessage('Faculty')">
            View
        </button>
    </div>

    <div class="card">
        <h3>Courses</h3>
        <p>Manage college courses</p>
        <button onclick="showMessage('Courses')">
            View
        </button>
    </div>
</div>

<footer>
    <p>&copy; 2026 College Management System</p>
</footer>

<script>
    function showMessage(name) {
        alert("Welcome to " + name + " Section");
    }
</script>

</body>
</html>
